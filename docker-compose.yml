# Dokploy construye desde este repo con el Dockerfile de la raíz:
# app Angular (client/) + API y websockets (server/) en mapas.appsmx.tech.
services:
  mapas-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Llave de Google Maps para el navegador (Dokploy → Environment). No va en git.
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
    volumes:
      - /home/rvillegas/mapas/server-data:/app/dist/data
    networks:
      - dokploy-network
      - default
    expose:
      - "3000"
networks:
  dokploy-network:
    external: true
